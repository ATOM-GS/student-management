version: 0.0
os: linux

files:
  - source: target/student-management-0.0.1-SNAPSHOT.jar
    destination: /opt/student-management

hooks:
  ApplicationStop:
    - location: scripts/stop.sh
      timeout: 30
      runas: root

  ApplicationStart:
    - location: scripts/start.sh
      timeout: 30
      runas: root